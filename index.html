<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wait.</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Space Grotesk', 'Inter', 'sans-serif'],
                    },
                    colors: {
                        accent: {
                            DEFAULT: '#6366f1',
                            glow: '#818cf8',
                        }
                    }
                }
            }
        }
    </script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* Медленно и плавно мигающая точка */
        @keyframes slowBlink {
            0%, 100% {
                opacity: 1;
                filter: drop-shadow(0 0 18px rgba(99, 102, 241, 0.9));
                transform: scale(1);
            }
            50% {
                opacity: 0.12;
                filter: drop-shadow(0 0 2px rgba(99, 102, 241, 0.1));
                transform: scale(0.85);
            }
        }

        .blinking-dot {
            display: inline-block;
            animation: slowBlink 2.8s cubic-bezier(0.4, 0, 0.6, 1) infinite;
            color: #6366f1;
            transition: color 0.5s ease;
        }

        /* Мягкое свечение заднего фона */
        .ambient-glow {
            position: absolute;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.25;
            pointer-events: none;
            transition: all 0.8s ease-out;
        }

        /* Стили кастомного уведомления (toast) */
        .toast {
            transform: translateY(100px);
            opacity: 0;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.4s ease;
        }
        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }

        /* Анимированный градиентный текст для статуса */
        .gradient-text {
            background: linear-gradient(135deg, #a5b4fc, #6366f1, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
    </style>
</head>
<body class="bg-neutral-950 text-neutral-100 font-sans min-h-screen flex flex-col justify-between overflow-hidden relative selection:bg-indigo-500 selection:text-white">

    <!-- Фоновый Canvas для интерактивных плавающих частиц -->
    <canvas id="particles-canvas" class="absolute inset-0 z-0 pointer-events-none"></canvas>

    <!-- Интерактивное свечение, следующее за курсором -->
    <div id="cursor-glow" class="ambient-glow w-96 h-96 bg-indigo-600 top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 z-0"></div>
    <div class="ambient-glow w-80 h-80 bg-purple-600 top-1/4 left-1/4 z-0"></div>

    <!-- Шапка сайта с плашкой статуса -->
    <header class="relative z-10 w-full max-w-7xl mx-auto p-6 md:p-10 flex justify-between items-center">
        <div class="flex items-center space-x-3 bg-neutral-900/80 backdrop-blur-md border border-neutral-800/80 px-4 py-2 rounded-full shadow-lg">
            <span class="relative flex h-2.5 w-2.5">
                <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-indigo-400 opacity-75"></span>
                <span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-indigo-500"></span>
            </span>
            <span class="text-xs uppercase tracking-widest text-neutral-400 font-medium">Сайт в разработке</span>
        </div>
    </header>

    <!-- Основной блок по центру -->
    <main class="relative z-10 flex-1 flex flex-col items-center justify-center text-center px-4 my-auto">
        <!-- Главная надпись с медленно мигающей точкой -->
        <div class="relative group cursor-default">
            <h1 class="text-7xl sm:text-8xl md:text-9xl lg:text-[12rem] font-bold tracking-tight text-white transition-all duration-500 select-none">
                Wait<span id="dot" class="blinking-dot">.</span>
            </h1>
        </div>

        <!-- Подзаголовок -->
        <p class="mt-6 text-lg sm:text-xl text-neutral-400 max-w-md mx-auto font-light leading-relaxed">
            Я создаю кое-что особенное.
        </p>
    </main>

    <!-- Подвал сайта -->
    <footer class="relative z-10 w-full max-w-7xl mx-auto p-6 md:p-10 flex flex-col sm:flex-row justify-between items-center text-xs text-neutral-500 gap-4">

        <div class="flex space-x-6 text-sm">
            <a href="#" class="hover:text-neutral-300 transition-colors" title="Twitter / X"><i class="fa-brands fa-x-twitter"></i></a>
        </div>
    </footer>

    <!-- Кастомное всплывающее уведомление (Toast вместо alert) -->
    <div id="toast" class="toast fixed bottom-8 left-1/2 -translate-x-1/2 z-50 bg-neutral-900 border border-neutral-700 text-neutral-100 px-6 py-3.5 rounded-2xl shadow-2xl flex items-center space-x-3">
        <i class="fa-solid fa-circle-check text-emerald-400 text-lg"></i>
        <span id="toast-message" class="text-sm font-medium">Спасибо! Мы уведомим вас о запуске.</span>
    </div>

    <script>
        // Установка текущего года в футере
        document.getElementById('year').textContent = new Date().getFullYear();

        // Динамическое слежение свечения за курсором мыши
        const glow = document.getElementById('cursor-glow');
        window.addEventListener('mousemove', (e) => {
            glow.style.left = `${e.clientX}px`;
            glow.style.top = `${e.clientY}px`;
        });

        // Смена цветового акцента для мигающей точки
        function changeTheme(color) {
            const dot = document.getElementById('dot');
            dot.style.color = color;
            
            // Обновляем CSS анимацию для свечения выбранного цвета
            const style = document.createElement('style');
            style.innerHTML = `
                @keyframes slowBlink {
                    0%, 100% {
                        opacity: 1;
                        filter: drop-shadow(0 0 18px ${color});
                        transform: scale(1);
                    }
                    50% {
                        opacity: 0.12;
                        filter: drop-shadow(0 0 2px ${color}33);
                        transform: scale(0.85);
                    }
                }
            `;
            document.head.appendChild(style);
    <!-- Подвал сайта -->
    <footer class="relative z-10 w-full max-w-7xl mx-auto p-6 md:p-10 flex flex-col sm:flex-row justify-between items-center text-xs text-neutral-500 gap-4">
        <div>
            &copy; <span id="year"></span> All rights reserved.
        </div>
        <div class="flex space-x-6 text-sm">
            <a href="#" class="hover:text-neutral-300 transition-colors" title="Telegram"><i class="fa-brands fa-telegram"></i></a>
            <a href="#" class="hover:text-neutral-300 transition-colors" title="Twitter / X"><i class="fa-brands fa-x-twitter"></i></a>
            <a href="#" class="hover:text-neutral-300 transition-colors" title="GitHub"><i class="fa-brands fa-github"></i></a>
        </div>
    </footer>

    <script>
        // Установка текущего года в футере
        document.getElementById('year').textContent = new Date().getFullYear();

        // Динамическое слежение свечения за курсором мыши
        const glow = document.getElementById('cursor-glow');
        window.addEventListener('mousemove', (e) => {
            glow.style.left = `${e.clientX}px`;
            glow.style.top = `${e.clientY}px`;
        });

        // ----- Интерактивная система частиц на Canvas -----
        const canvas = document.getElementById('particles-canvas');
        const ctx = canvas.getContext('2d');

        let width, height;
        let particles = [];

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }

        class Particle {
            constructor() {
                this.reset();
            }

            reset() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.vx = (Math.random() - 0.5) * 0.3;
                this.vy = (Math.random() - 0.5) * 0.3;
                this.size = Math.random() * 1.5 + 0.5;
                this.alpha = Math.random() * 0.5 + 0.1;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;

                if (this.x < 0 || this.x > width || this.y < 0 || this.y > height) {
                    this.reset();
                }
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 255, 255, ${this.alpha})`;
                ctx.fill();
            }
        }

        function initParticles() {
            resize();
            particles = [];
            const particleCount = Math.floor((width * height) / 15000);
            for (let i = 0; i < particleCount; i++) {
                particles.push(new Particle());
            }
        }

        function animate() {
            ctx.clearRect(0, 0, width, height);
            particles.forEach(p => {
                p.update();
                p.draw();
            });
            requestAnimationFrame(animate);
        }

        window.addEventListener('resize', initParticles);
        
        // Запуск анимации частиц
        initParticles();
        animate();
    </script>
</body>
</html>
